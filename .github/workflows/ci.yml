name: Rivock CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: rivock
          POSTGRES_PASSWORD: ci_synthetic_only
          POSTGRES_DB: rivock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rivock -d rivock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rivock:ci_synthetic_only@localhost:5432/rivock_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check --config pyproject.toml app tests tests_unit migrations ../scripts
      - run: pytest -q
      - run: pytest ../scripts/tests -q
      - run: python -m app.cli export-openapi ../frontend/openapi.json
      - run: git diff --exit-code -- ../frontend/openapi.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run generate:api
      - run: git diff --exit-code -- src/generated/api-schema.ts
      - run: npm run build
      - run: npm audit --audit-level=high
  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - deployment_environment: production
            clerk_public_key: pk_live_Y2xlcmsucml2b2NrLmV4YW1wbGUk
            clerk_issuer: https://clerk.rivock.example
          - deployment_environment: preview
            clerk_public_key: pk_test_c3ludGhldGljLmNsZXJrLmFjY291bnRzLmRldiQ
            clerk_issuer: https://synthetic.clerk.accounts.dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/app.Dockerfile
          # Synthetic public key for a non-existent host; never deployed.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ matrix.clerk_public_key }}
            DEPLOYMENT_ENVIRONMENT=${{ matrix.deployment_environment }}
          push: false
          load: true
          tags: rivock-app:ci
      - name: Check combined hosted routing without external services
        run: |
          docker run --rm -i \
            --env ENVIRONMENT=${{ matrix.deployment_environment }} \
            --env 'DATABASE_URL=postgresql+psycopg://synthetic:synthetic@invalid.example/rivock?sslmode=verify-full' \
            --env CLERK_ISSUER=${{ matrix.clerk_issuer }} \
            --env CLERK_AUTHORIZED_PARTIES=https://rivock.example \
            --env CORS_ORIGINS=https://rivock.example \
            --env RATE_HMAC_SECRET=synthetic-hosting-check-only-32-characters \
            --env MODERATION_MODE=pending rivock-app:ci python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from app.main import app
          from app.config import settings
          assert os.getuid() == 10001
          with TestClient(app) as client:
              home = client.get('/')
              assert home.status_code == 200
              assert home.headers['cache-control'] == 'no-cache'
              assert settings().clerk_issuer in home.headers['content-security-policy']
              assert client.get('/threads/synthetic', headers={'Accept': 'text/html'}).content == home.content
              assert client.head('/threads/synthetic', headers={'Accept': 'text/html'}).content == b''
              for path in ['/docs', '/openapi.json', '/api/v1/missing', '/assets/missing.js', '/.env', '/bad%00path']:
                  response = client.get(path, headers={'Accept': 'text/html'})
                  assert response.status_code == 404, path
                  assert response.headers['cache-control'] == 'no-store'
          PY
